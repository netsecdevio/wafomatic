# Daily package and lock updates. Managed org-wide; see netsecdevio/.github.
#
# Updates are grouped so a day produces a few reviewable PRs rather than
# dozens. Major bumps stay separate because they need a human decision.
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/cli-app/infra/nginx"
      - "/cli-app/infra/web-app"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "npm"
    directories:
      - "/cli-app"
      - "/cli-app/infra/web-app"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "uv"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      uv-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
